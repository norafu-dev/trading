# Production on the server. Run through deploy/deploy.sh, which sets IMAGE_TAG.
name: harvester

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
  TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?set in .env}
  TOKEN_ENCRYPTION_OLD_KEYS: ${TOKEN_ENCRYPTION_OLD_KEYS:-}
  SITE_ORIGIN: https://${SITE_DOMAIN:?set in .env}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

# 附件存储（spec 0011）：两个进程共用的部分。线上只能是 r2，两个 token 各给各的进程。
x-media-env: &media-env
  MEDIA_STORAGE: r2
  MEDIA_R2_ACCOUNT_ID: ${MEDIA_R2_ACCOUNT_ID:?set in .env}
  MEDIA_R2_BUCKET: ${MEDIA_R2_BUCKET:?set in .env}

x-backend: &backend
  image: ${IMAGE_PREFIX:?set in .env}-backend:${IMAGE_TAG:?set by deploy.sh}
  environment: *backend-env
  logging: *logging

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    environment:
      <<: [*backend-env, *media-env]
      # 只读 token：api 只签发读取链接，拿不到写权限。
      MEDIA_R2_READ_ACCESS_KEY_ID: ${MEDIA_R2_READ_ACCESS_KEY_ID:?set in .env}
      MEDIA_R2_READ_SECRET_ACCESS_KEY: ${MEDIA_R2_READ_SECRET_ACCESS_KEY:?set in .env}
    command: ["python", "-m", "harvester.api"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  collector:
    <<: *backend
    environment:
      <<: [*backend-env, *media-env]
      # 读写 token：只有 collector 往桶里写文件。
      MEDIA_R2_WRITE_ACCESS_KEY_ID: ${MEDIA_R2_WRITE_ACCESS_KEY_ID:?set in .env}
      MEDIA_R2_WRITE_SECRET_ACCESS_KEY: ${MEDIA_R2_WRITE_SECRET_ACCESS_KEY:?set in .env}
    command: ["python", "-m", "harvester.collector"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: ${IMAGE_PREFIX:?set in .env}-caddy:${IMAGE_TAG:?set by deploy.sh}
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
