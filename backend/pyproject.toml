[project]
name = "harvester"
version = "0.1.0"
description = "Discord channel collector: collector and api processes sharing one PostgreSQL."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "discord-py-self==2.1.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.2",
    "pyotp>=2.10.0",
    "sqlalchemy[asyncio]>=2.1.6",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# 注释和界面文案是简体中文（AGENTS.md），全角标点不是"易混淆字符"。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pyright]
include = ["src", "migrations"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
